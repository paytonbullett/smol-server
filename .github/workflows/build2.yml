name: Build and Test Llama Lambda Container

on:
  # Allows manual triggers from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: 'Seconds to wait before grabbing logs (default: 10)'
        required: false
        default: '10'
        type: string
  # Optional: Keep automatic triggers on push/PR (delete these 4 lines if you want manual ONLY)
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t llama-lambda-test:latest .

      - name: Run container & print execution logs
        run: |
          WAIT_TIME="${{ github.event.inputs.wait_seconds || '10' }}"

          echo "=================================================="
          echo "         STARTING CONTAINER DIAGNOSTICS          "
          echo "=================================================="
          
          # Start container in detached mode
          CONTAINER_ID=$(docker run -d --name llama-runner -p 8080:8080 llama-lambda-test:latest)

          echo "Waiting ${WAIT_TIME}s for startup/crash output..."
          sleep "$WAIT_TIME"

          echo ""
          echo "=================================================="
          echo "              CONTAINER LOG OUTPUT                "
          echo "=================================================="
          
          # Dump both stdout and stderr into one clean block
          docker logs "$CONTAINER_ID" 2>&1 || true

          echo "=================================================="

          # Check process exit state
          RUNNING=$(docker inspect "$CONTAINER_ID" --format='{{.State.Running}}')
          EXIT_CODE=$(docker inspect "$CONTAINER_ID" --format='{{.State.ExitCode}}')

          # Cleanup container
          docker rm -f "$CONTAINER_ID" > /dev/null 2>&1

          if [ "$RUNNING" = "false" ] && [ "$EXIT_CODE" != "0" ]; then
            echo "ERROR: Container crashed on startup with exit code: $EXIT_CODE"
            exit 1
          else
            echo "SUCCESS: Container initialized without crashing."
          fi
